name: Diagnose workflow parsing

on:
  push:
    branches:
      - chatgpt/angulismotv-etapa5-2026-10-27
    paths:
      - '.github/workflows/diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse build YAML
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/build.yml"); puts "YAML OK"'
