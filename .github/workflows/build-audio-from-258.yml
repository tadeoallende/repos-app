name: Audio sobre base exacta build 258

on:
  push:
    branches:
      - chatgpt/prueba-acceso-2026-10-21-3
    paths:
      - '.github/workflows/build-audio-from-258.yml'
      - '.github/patches/audio-etapa58-*.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-build-258-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_IPTV_ORG_URL: 'https://iptv-org.github.io/iptv/index.m3u'
      ORG_GRADLE_PROJECT_REMOTE_SOURCES_CONFIG_URL: 'https://raw.githubusercontent.com/tadeoallende/repos-app/refs/heads/chatgpt/prueba-acceso-2026-10-21-3/fuentes.json'
      ORG_GRADLE_PROJECT_CHANNELS_URL: ''
      ORG_GRADLE_PROJECT_EVENTS_URL: ''
      ORG_GRADLE_PROJECT_CUSTOM_CHANNELS_URL: 'https://raw.githubusercontent.com/tadeoallende/repos-app/refs/heads/main/canales.json'
      ORG_GRADLE_PROJECT_UPDATE_URL: ${{ secrets.UPDATE_URL }}
      ORG_GRADLE_PROJECT_WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y verificar fuentes exactas de la release build-258
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/tadeoallende/repos-app/releases/download/build-258/AngulismoTV-ui-estandarizado.zip' \
            --output "$RUNNER_TEMP/build-258.zip"
          echo '05e800ea8c022af8941732a184755998fdb3a28b0227dba3de6cb3a8cf854483  '"$RUNNER_TEMP/build-258.zip" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/build-258.zip" -d "$RUNNER_TEMP/source"
          SOURCE_ROOT="$RUNNER_TEMP/source"
          if [ ! -f "$SOURCE_ROOT/settings.gradle.kts" ]; then
            SOURCE_ROOT="$(find "$RUNNER_TEMP/source" -mindepth 1 -name settings.gradle.kts -printf '%h\n' | head -1)"
          fi
          test -n "$SOURCE_ROOT" && test -f "$SOURCE_ROOT/settings.gradle.kts"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "Base verificada: release build-258 (SHA-256 05e800ea8c022af8941732a184755998fdb3a28b0227dba3de6cb3a8cf854483)"
          echo "Raíz Android: $SOURCE_ROOT"

      - name: Aplicar únicamente los tres parches de diagnóstico de audio
        run: |
          set -euo pipefail
          for PATCH_FILE in .github/patches/audio-etapa58-0*.patch; do
            test -s "$PATCH_FILE"
            echo "Aplicando $(basename "$PATCH_FILE")"
            patch --batch --forward --no-backup-if-mismatch -p1 -d "$SOURCE_ROOT" < "$PATCH_FILE"
          done
          find "$SOURCE_ROOT/app/src/main/res" -type f -name '*.orig' -delete
          grep -Fq 'lastAudioErrorGeneration' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/UnifiedPlayerActivity.kt"
          grep -Fq 'createRenderersFactory' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/player/StreamMediaSourceFactory.kt"
          test -s "$SOURCE_ROOT/app/src/main/res/drawable/ic_audio_info.xml"
          python3 .github/scripts/fix_modern_source_compile_errors.py "$SOURCE_ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.SOURCE_ROOT }}

      - name: Pruebas unitarias
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        working-directory: ${{ env.SOURCE_ROOT }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Compilar APK release
        working-directory: ${{ env.SOURCE_ROOT }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Guardar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-base-build-258-audio
          path: ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Guardar APK release sin firma garantizada
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-base-build-258-audio
          path: ${{ env.SOURCE_ROOT }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Guardar fuentes parcheadas para auditoría
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-build-258-audio
          path: ${{ env.SOURCE_ROOT }}
          if-no-files-found: error
          retention-days: 30

  probar-en-emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug-base-build-258-audio
          path: apk
      - name: Ejecutar smoke test en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.angulismotv/.MainActivity
            sleep 20
            adb logcat -d > full.log
            adb shell pidof com.angulismotv
            if grep -q "FATAL EXCEPTION" full.log; then
              grep -A30 "FATAL EXCEPTION" full.log | head -80 || true
              exit 1
            fi
