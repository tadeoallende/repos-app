name: Build APK Release firmado desde ZIP limpio

run-name: "AngulismoTV Release firmado · ZIP limpio"

on:
  push:
    branches:
      - chatgpt/prueba-acceso-2026-10-21-3
    paths:
      - ".github/workflows/build-clean-signed.yml"
      - "AngulismoTV-ui-estandarizado.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-signed:
    name: Compilar y verificar APK Release firmado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout de la rama de prueba
        uses: actions/checkout@v4
        with:
          ref: chatgpt/prueba-acceso-2026-10-21-3

      - name: Verificar ZIP exacto y extraer fuentes limpias
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AngulismoTV-ui-estandarizado.zip"
          EXPECTED_GIT_BLOB_SHA="445984424a5a1057fc308aff5622987965a35900"
          test -s "$ZIP"
          ACTUAL_GIT_BLOB_SHA="$(git hash-object -- "$ZIP")"
          if [[ "$ACTUAL_GIT_BLOB_SHA" != "$EXPECTED_GIT_BLOB_SHA" ]]; then
            echo "::error::El ZIP no coincide con el archivo verificado en la rama."
            echo "Esperado Git blob: $EXPECTED_GIT_BLOB_SHA"
            echo "Encontrado Git blob: $ACTUAL_GIT_BLOB_SHA"
            exit 1
          fi
          ZIP_SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "SHA-256 del ZIP fuente: $ZIP_SHA256"
          unzip -t "$ZIP" | tail -n 2
          PROJECT_DIR="$RUNNER_TEMP/angulismotv-clean-source"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ZIP" -d "$PROJECT_DIR"
          test -s "$PROJECT_DIR/settings.gradle.kts"
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -x "$PROJECT_DIR/gradlew" || chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$ZIP_SHA256" >> "$GITHUB_ENV"
          echo "Se compilará únicamente el ZIP limpio verificado; no se aplican parches."

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Instalar plataforma y herramientas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar y validar la clave de firma Android
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ||
                -z "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" ||
                -z "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" ||
                -z "$ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Faltan uno o más secretos ANDROID_RELEASE_* para firmar el APK."
            echo "Se requieren ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS y ANDROID_RELEASE_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/angulismotv-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" \
            -alias "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" >/dev/null
          echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Firma Android preparada y alias validado; no se imprimen credenciales."

      - name: Compilar Release firmado
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease --stacktrace

      - name: Verificar firma del APK
        id: verify
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::No se generó el APK Release."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::No se encontró apksigner."; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/AngulismoTV-release-firmado.apk"
          (cd "$GITHUB_WORKSPACE" && sha256sum AngulismoTV-release-firmado.apk > AngulismoTV-release-firmado.sha256)
          echo "APK firmado, verificado y listo para publicar."

      - name: Prueba de arranque Release en Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -uo pipefail
            APP_ID="com.angulismotv"
            PREFIX="$GITHUB_WORKSPACE/startup-api-30"
            set +e
            adb install -r "$GITHUB_WORKSPACE/AngulismoTV-release-firmado.apk" > "${PREFIX}-install.txt" 2>&1
            INSTALL_RC=$?
            if [ "$INSTALL_RC" -ne 0 ]; then cat "${PREFIX}-install.txt"; exit 1; fi
            adb logcat -c
            adb shell am force-stop "$APP_ID" >/dev/null 2>&1
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$APP_ID" > "${PREFIX}-start.txt" 2>&1
            START_RC=$?
            sleep 15
            adb logcat -d -v threadtime > "${PREFIX}-logcat.txt"
            adb shell dumpsys activity activities > "${PREFIX}-activities.txt" 2>&1
            adb shell screencap -p /sdcard/startup-screen.png && adb pull /sdcard/startup-screen.png "${PREFIX}-screen.png" >/dev/null 2>&1
            PID="$(adb shell pidof "$APP_ID" | tr -d '\r')"
            if [ "$START_RC" -ne 0 ] || [ -z "$PID" ] || grep -Eq 'FATAL EXCEPTION|Fatal signal [0-9]+|Process: com\.angulismotv' "${PREFIX}-logcat.txt"; then
              echo "::error::El APK Release falla al iniciar en Android API 30."
              grep -E -A35 -B8 'FATAL EXCEPTION|Fatal signal|Process: com\.angulismotv|AndroidRuntime' "${PREFIX}-logcat.txt" | tail -180 || true
              cat "${PREFIX}-start.txt" || true
              exit 1
            fi
            echo "Inicio verificado en Android API 30; PID=$PID"

      - name: Prueba de arranque Release en Android 14 (API 34)
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -uo pipefail
            APP_ID="com.angulismotv"
            PREFIX="$GITHUB_WORKSPACE/startup-api-34"
            set +e
            adb install -r "$GITHUB_WORKSPACE/AngulismoTV-release-firmado.apk" > "${PREFIX}-install.txt" 2>&1
            INSTALL_RC=$?
            if [ "$INSTALL_RC" -ne 0 ]; then cat "${PREFIX}-install.txt"; exit 1; fi
            adb logcat -c
            adb shell am force-stop "$APP_ID" >/dev/null 2>&1
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$APP_ID" > "${PREFIX}-start.txt" 2>&1
            START_RC=$?
            sleep 15
            adb logcat -d -v threadtime > "${PREFIX}-logcat.txt"
            adb shell dumpsys activity activities > "${PREFIX}-activities.txt" 2>&1
            adb shell screencap -p /sdcard/startup-screen.png && adb pull /sdcard/startup-screen.png "${PREFIX}-screen.png" >/dev/null 2>&1
            PID="$(adb shell pidof "$APP_ID" | tr -d '\r')"
            if [ "$START_RC" -ne 0 ] || [ -z "$PID" ] || grep -Eq 'FATAL EXCEPTION|Fatal signal [0-9]+|Process: com\.angulismotv' "${PREFIX}-logcat.txt"; then
              echo "::error::El APK Release falla al iniciar en Android API 34."
              grep -E -A35 -B8 'FATAL EXCEPTION|Fatal signal|Process: com\.angulismotv|AndroidRuntime' "${PREFIX}-logcat.txt" | tail -180 || true
              cat "${PREFIX}-start.txt" || true
              exit 1
            fi
            echo "Inicio verificado en Android API 34; PID=$PID"

      - name: Guardar logs y capturas del arranque para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics-${ github.run_id }
          path: |
            startup-api-30-*
            startup-api-34-*
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar APK Release firmado con enlace directo
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="angulismotv-signed-clean-${{ github.run_id }}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/AngulismoTV-release-firmado.apk" \
            "$GITHUB_WORKSPACE/AngulismoTV-release-firmado.sha256" \
            --target "$GITHUB_SHA" \
            --title "AngulismoTV APK Release firmado (ZIP limpio)" \
            --notes "Compilación Release desde AngulismoTV-ui-estandarizado.zip. SHA-256 del ZIP fuente: $ZIP_SHA256. Sin aplicación de parches. Firma Android verificada con apksigner. Commit: $GITHUB_SHA." \
            --prerelease
          APK_URL="https://github.com/tadeoallende/repos-app/releases/download/$TAG/AngulismoTV-release-firmado.apk"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## APK Release firmado"
            echo "- [Descargar APK firmado]($APK_URL)"
            echo "- Etiqueta de release: $TAG"
            echo "- SHA-256 del ZIP fuente: $ZIP_SHA256"
            echo "- La firma fue verificada con apksigner."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar también como artefacto de Actions
        uses: actions/upload-artifact@v4
        with:
          name: AngulismoTV-release-firmado
          path: |
            AngulismoTV-release-firmado.apk
            AngulismoTV-release-firmado.sha256
          if-no-files-found: error
          retention-days: 30