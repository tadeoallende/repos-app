name: Publicar actualización firmada de AngulismoTV

on:
  push:
    branches:
      - chatgpt/prueba-acceso-2026-10-21-3
    paths:
      - ".github/update-release.json"

permissions:
  contents: write

concurrency:
  group: publish-angulismotv-update
  cancel-in-progress: false

jobs:
  publish-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout de la rama que generó el APK
        uses: actions/checkout@v4
        with:
          ref: chatgpt/prueba-acceso-2026-10-21-3
          fetch-depth: 0

      - name: Leer la versión exacta de las fuentes y manifiesto actual
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AngulismoTV-completo-etapa5.zip"
          test -s "$ZIP"
          mkdir -p "$RUNNER_TEMP/candidate-source" "$RUNNER_TEMP/production-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/candidate-source"
          GRADLE_FILE="$RUNNER_TEMP/candidate-source/app/build.gradle.kts"
          PUBLIC_KEY="$RUNNER_TEMP/candidate-source/app/src/main/res/raw/update_public_key.pem"
          test -s "$GRADLE_FILE"
          test -s "$PUBLIC_KEY"

          git fetch origin main
          git show origin/main:"AngulismoTV-limpio (1).zip" > "$RUNNER_TEMP/production-source.zip"
          unzip -q "$RUNNER_TEMP/production-source.zip" -d "$RUNNER_TEMP/production-source"
          TRUSTED_PUBLIC_KEY="$(find "$RUNNER_TEMP/production-source" -type f -path '*/app/src/main/res/raw/update_public_key.pem' -print -quit)"
          test -n "$TRUSTED_PUBLIC_KEY" && test -s "$TRUSTED_PUBLIC_KEY"

          openssl pkey -pubin -in "$PUBLIC_KEY" -outform DER -out "$RUNNER_TEMP/candidate-public.der"
          openssl pkey -pubin -in "$TRUSTED_PUBLIC_KEY" -outform DER -out "$RUNNER_TEMP/trusted-public.der"
          cmp -s "$RUNNER_TEMP/candidate-public.der" "$RUNNER_TEMP/trusted-public.der" || {
            echo "::error::La clave pública del APK candidato no coincide con la clave confiada por la versión de producción. No se publicará."
            exit 1
          }

          python3 - "$GRADLE_FILE" "$RUNNER_TEMP/current-update.json" "$GITHUB_OUTPUT" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          gradle_path, current_path, output_path = sys.argv[1:]
          current = json.loads(subprocess.check_output(
              ["git", "show", "origin/main:update.json"], text=True
          ))
          gradle = Path(gradle_path).read_text(encoding="utf-8")
          code = re.search(r"^\\s*versionCode\\s*=\\s*(\\d+)\\s*$", gradle, re.M)
          name = re.search(r'^\\s*versionName\\s*=\\s*"([^"\\n]+)"\\s*$', gradle, re.M)
          if not code or not name:
              raise SystemExit("No pude leer versionCode/versionName del ZIP fuente de esta APK.")
          version_code, version_name = int(code.group(1)), name.group(1)
          current_code = int(current["versionCode"])
          if version_code <= current_code:
              raise SystemExit(
                  f"El APK candidato no es una actualización: versionCode={version_code}, "
                  f"manifiesto actual={current_code}. Hay que incrementar versionCode y recompilar."
              )
          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"version_code={version_code}\\n")
              out.write(f"version_name={version_name}\\n")
              out.write(f"current_code={current_code}\\n")
          print(f"Versión candidata {version_name} (code {version_code}); producción actual code {current_code}.")
          PY

      - name: Descargar APK y validar identidad y versión
        id: apk
        shell: bash
        env:
        run: |
          set -euo pipefail
          APK_URL="$(python3 -c 'import json; print(json.load(open(".github/update-release.json"))["apkUrl"])')"
          [[ "$APK_URL" == https://* ]]
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            --max-filesize 200000000 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/angulismotv-update.apk" "$APK_URL"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging "$RUNNER_TEMP/angulismotv-update.apk")"
          PACKAGE="$(printf '%s\\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
          APK_CODE="$(printf '%s\\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" | head -1)"
          APK_NAME="$(printf '%s\\n' "$BADGING" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -1)"
          test "$PACKAGE" = "com.angulismotv" || { echo "::error::El APK no pertenece a com.angulismotv."; exit 1; }
          test "$APK_CODE" = "${{ steps.version.outputs.version_code }}" || { echo "::error::El versionCode del APK no coincide con las fuentes."; exit 1; }
          test "$APK_NAME" = "${{ steps.version.outputs.version_name }}" || { echo "::error::El versionName del APK no coincide con las fuentes."; exit 1; }
          SHA256="$(sha256sum "$RUNNER_TEMP/angulismotv-update.apk" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_version_code=$APK_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_version_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK validado: $PACKAGE $APK_NAME ($APK_CODE), SHA-256 calculado."

      - name: Crear manifiesto y firmarlo con RSA-SHA256
        env:
          UPDATE_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_PRIVATE_KEY_PEM }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path(".github/update-release.json").read_text(encoding="utf-8"))
          manifest = {
              "versionCode": int(__import__("os").environ["VERSION_CODE"]),
              "versionName": __import__("os").environ["VERSION_NAME"],
              "apkUrl": config["apkUrl"],
              "sha256": __import__("os").environ["APK_SHA256"],
              "releaseNotes": config["releaseNotes"][:4000],
              "forceUpdate": bool(config.get("forceUpdate", False)),
          }
          Path(__import__("os").environ["RUNNER_TEMP"] + "/update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          PY
          if [[ -z "${UPDATE_PRIVATE_KEY_PEM:-}" ]]; then
            echo "::error::Falta el secreto UPDATE_PRIVATE_KEY_PEM."
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/update-private.pem"
          DER_PRIVATE_PUBLIC="$RUNNER_TEMP/derived-public.der"
          DER_TRUSTED_PUBLIC="$RUNNER_TEMP/trusted-public.der"
          SIGNATURE="$RUNNER_TEMP/update.json.sig.bin"
          trap 'rm -f "$KEY" "$DER_PRIVATE_PUBLIC" "$DER_TRUSTED_PUBLIC" "$SIGNATURE"' EXIT
          printf '%s\\n' "$UPDATE_PRIVATE_KEY_PEM" > "$KEY"
          unset UPDATE_PRIVATE_KEY_PEM
          openssl pkey -in "$KEY" -noout >/dev/null
          openssl pkey -in "$KEY" -pubout -outform DER -out "$DER_PRIVATE_PUBLIC"
          openssl pkey -pubin -in "$RUNNER_TEMP/candidate-source/app/src/main/res/raw/update_public_key.pem" -outform DER -out "$DER_TRUSTED_PUBLIC"
          cmp -s "$DER_PRIVATE_PUBLIC" "$DER_TRUSTED_PUBLIC" || {
            echo "::error::UPDATE_PRIVATE_KEY_PEM no corresponde a la clave pública integrada en la app."
            exit 1
          }
          openssl dgst -sha256 -sign "$KEY" -out "$SIGNATURE" "$RUNNER_TEMP/update.json"
          base64 -w 0 "$SIGNATURE" > "$RUNNER_TEMP/update.json.sig"
          printf '\\n' >> "$RUNNER_TEMP/update.json.sig"
          openssl dgst -sha256 -verify <(openssl pkey -in "$KEY" -pubout) -signature "$SIGNATURE" "$RUNNER_TEMP/update.json"

      - name: Publicar update.json y firma en main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/production" origin/main
          install -m 644 "$RUNNER_TEMP/update.json" "$RUNNER_TEMP/production/update.json"
          install -m 644 "$RUNNER_TEMP/update.json.sig" "$RUNNER_TEMP/production/update.json.sig"
          cd "$RUNNER_TEMP/production"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json update.json.sig
          git commit -m "release: publish AngulismoTV update ${{ steps.version.outputs.version_name }}"
          git push origin HEAD:main
          echo "Manifiesto firmado publicado en main."
