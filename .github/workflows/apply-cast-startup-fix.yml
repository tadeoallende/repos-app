name: Aplicar corrección de inicio Cast al ZIP fuente

on:
  push:
    branches:
      - chatgpt/prueba-acceso-2026-10-21-3
    paths:
      - ".github/workflows/apply-cast-startup-fix.yml"
      - ".github/patches/cast-startup-crash-fix.patch"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cast-startup-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-source-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: chatgpt/prueba-acceso-2026-10-21-3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout de la rama de pruebas
        uses: actions/checkout@v4
        with:
          ref: chatgpt/prueba-acceso-2026-10-21-3
          fetch-depth: 5

      - name: Corregir el inicio Cast y conservar la clave pública
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AngulismoTV-ui-estandarizado.zip"
          test -s "$ZIP"
          SRC_PARENT="$RUNNER_TEMP/angulismotv-patched"
          mkdir -p "$SRC_PARENT"
          unzip -q "$ZIP" -d "$SRC_PARENT"
          SOURCE_ROOT="$SRC_PARENT"
          if [ ! -f "$SOURCE_ROOT/settings.gradle.kts" ]; then
            SETTINGS="$(find "$SRC_PARENT" -mindepth 1 -name settings.gradle.kts -print -quit)"
            test -n "$SETTINGS"
            SOURCE_ROOT="$(dirname "$SETTINGS")"
          fi
          test -s "$SOURCE_ROOT/app/build.gradle.kts"

          # Esta clave pública la necesita R.raw.update_public_key para compilar.
          # La última normalización accidentalmente la excluyó junto con los PEM.
          SOURCE_NEEDS_REPACK=false
          KEY_PATH="$SOURCE_ROOT/app/src/main/res/raw/update_public_key.pem"
          if [[ ! -s "$KEY_PATH" ]]; then
            ORIGINAL_ZIP="$RUNNER_TEMP/original-ui-estandarizado.zip"
            ORIGINAL_COMMIT="2f9aef79835a3369d1bfc6a5869fc871d75626c2"
            git show "$ORIGINAL_COMMIT:AngulismoTV-ui-estandarizado.zip" > "$ORIGINAL_ZIP"
            KEY_ENTRY="$(unzip -Z1 "$ORIGINAL_ZIP" | grep -E '(^|/)app/src/main/res/raw/update_public_key\.pem$' | head -n 1 || true)"
            if [[ -z "$KEY_ENTRY" ]]; then
              echo "::error::No se encontró update_public_key.pem en el ZIP fuente original."
              exit 1
            fi
            mkdir -p "$(dirname "$KEY_PATH")"
            unzip -p "$ORIGINAL_ZIP" "$KEY_ENTRY" > "$KEY_PATH"
            test -s "$KEY_PATH"
            SOURCE_NEEDS_REPACK=true
            echo "Restaurada la clave pública de verificación desde la fuente original."
          fi

          SOURCE_ALREADY_FIXED=false
          if grep -Fq 'private fun ensureCastInitialized(): CastContext' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/player/CastController.kt" &&
             grep -Fq 'Cast se inicializa bajo demanda al pulsar' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/App.kt" &&
             grep -Fq 'com.angulismotv.utils.CastOptionsProvider' "$SOURCE_ROOT/app/proguard-rules.pro"; then
            SOURCE_ALREADY_FIXED=true
            echo "La corrección Cast ya está aplicada."
          else
            patch --batch --forward --fuzz=0 -p1 -d "$SOURCE_ROOT" < .github/patches/cast-startup-crash-fix.patch
            SOURCE_NEEDS_REPACK=true
          fi

          grep -Fq 'playServicesCast = "21.4.0"' "$SOURCE_ROOT/gradle/libs.versions.toml"
          grep -Fq 'mediarouter = "1.6.0"' "$SOURCE_ROOT/gradle/libs.versions.toml"
          grep -Fq 'private fun ensureCastInitialized(): CastContext' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/player/CastController.kt"
          grep -Fq 'Cast se inicializa bajo demanda al pulsar' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/App.kt"
          ! grep -Fq 'CastContext.getSharedInstance(this)' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/App.kt"
          grep -Fq 'com.angulismotv.utils.CastOptionsProvider' "$SOURCE_ROOT/app/proguard-rules.pro"
          test -s "$KEY_PATH"

          if [[ "$SOURCE_ALREADY_FIXED" == true && "$SOURCE_NEEDS_REPACK" == false ]]; then
            if [[ -s "$ZIP.sha256" ]]; then
              sha256sum --check "$ZIP.sha256"
            else
              sha256sum "$ZIP" > "$ZIP.sha256"
            fi
          else
            NEW_ZIP="$RUNNER_TEMP/AngulismoTV-ui-estandarizado.zip"
            # Keep update_public_key.pem: it is a public verification key, not a secret.
            (cd "$SOURCE_ROOT" && zip -qr "$NEW_ZIP" . \
              -x './.gradle/*' './.idea/*' './build/*' './app/build/*' \
                 './local.properties' './*.zip' './*.jks' './*.keystore' \
                 './keystore.properties' './.env' './.env.*')
            cp "$NEW_ZIP" "$ZIP"
            sha256sum "$ZIP" > "$ZIP.sha256"
          fi
          unzip -t "$ZIP" | tail -n 2
          echo "SHA-256 de la fuente corregida:"
          cat "$ZIP.sha256"

      - name: Confirmar la fuente corregida en la rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AngulismoTV-ui-estandarizado.zip" "AngulismoTV-ui-estandarizado.zip.sha256"
          if git diff --cached --quiet; then
            echo "El ZIP ya contiene los cambios y el checksum es válido."
          else
            git commit -m "fix: evitar crash de inicio por Cast y conservar clave pública"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Ejecutar build firmado y pruebas de arranque
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-clean-signed.yml --ref "$BRANCH"
          echo "Se solicitó a GitHub Actions compilar y probar el APK corregido."
