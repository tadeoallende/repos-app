name: Aplicar corrección de inicio Cast al ZIP fuente

on:
  push:
    branches:
      - chatgpt/prueba-acceso-2026-10-21-3
    paths:
      - ".github/workflows/apply-cast-startup-fix.yml"
      - ".github/patches/cast-startup-crash-fix.patch"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-source-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: chatgpt/prueba-acceso-2026-10-21-3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout de la rama de pruebas
        uses: actions/checkout@v4
        with:
          ref: chatgpt/prueba-acceso-2026-10-21-3

      - name: Aplicar corrección basada en el fallo conocido de Cast
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AngulismoTV-ui-estandarizado.zip"
          test -s "$ZIP"
          SRC_PARENT="$RUNNER_TEMP/angulismotv-patched"
          mkdir -p "$SRC_PARENT"
          unzip -q "$ZIP" -d "$SRC_PARENT"
          SOURCE_ROOT="$SRC_PARENT"
          if [ ! -f "$SOURCE_ROOT/settings.gradle.kts" ]; then
            SETTINGS="$(find "$SRC_PARENT" -mindepth 1 -name settings.gradle.kts -print -quit)"
            test -n "$SETTINGS"
            SOURCE_ROOT="$(dirname "$SETTINGS")"
          fi
          test -s "$SOURCE_ROOT/app/build.gradle.kts"
          patch --batch --forward --fuzz=0 -p1 -d "$SOURCE_ROOT" < .github/patches/cast-startup-crash-fix.patch
          grep -Fq 'playServicesCast = "21.4.0"' "$SOURCE_ROOT/gradle/libs.versions.toml"
          grep -Fq 'mediarouter = "1.6.0"' "$SOURCE_ROOT/gradle/libs.versions.toml"
          grep -Fq 'private fun ensureCastInitialized(): CastContext' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/player/CastController.kt"
          grep -Fq 'Cast se inicializa bajo demanda al pulsar' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/App.kt"
          ! grep -Fq 'CastContext.getSharedInstance(this)' "$SOURCE_ROOT/app/src/main/java/com/angulismotv/App.kt"
          grep -Fq 'com.angulismotv.utils.CastOptionsProvider' "$SOURCE_ROOT/app/proguard-rules.pro"

          NEW_ZIP="$RUNNER_TEMP/AngulismoTV-ui-estandarizado.zip"
          (cd "$SOURCE_ROOT" && zip -qr "$NEW_ZIP" . \
            -x './.gradle/*' './.idea/*' './build/*' './app/build/*' \
               './local.properties' './*.zip' './*.jks' './*.keystore' \
               './keystore.properties' './*.pem' './.env' './.env.*')
          cp "$NEW_ZIP" "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          unzip -t "$ZIP" | tail -n 2
          echo "SHA-256 de la fuente corregida:"
          cat "$ZIP.sha256"

      - name: Actualizar validación SHA-256 en los workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          ZIP_PATH = '      - "AngulismoTV-ui-estandarizado.zip"\n'
          SHA_PATH = ZIP_PATH + '      - "AngulismoTV-ui-estandarizado.zip.sha256"\n'
          SOURCE_SHA = '445984424a5a1057fc308aff5622987965a35900'

          def update(path: str, kind: str) -> None:
              target = Path(path)
              content = target.read_text()
              if SHA_PATH not in content:
                  if ZIP_PATH not in content:
                      raise SystemExit(f"No se encontró el filtro ZIP en {path}")
                  content = content.replace(ZIP_PATH, SHA_PATH, 1)
              if kind == "build":
                  pattern = re.compile(r'          EXPECTED_GIT_BLOB_SHA="[^"]+"\n.*?(?=          echo "SHA-256 del ZIP fuente:)', re.S)
                  suffix = '          ZIP_SHA256="$(sha256sum "$ZIP" | awk \'{print $1}\')"\n'
              else:
                  pattern = re.compile(r'          EXPECTED_GIT_BLOB_SHA="[^"]+"\n.*?(?=          unzip -t "$ZIP")', re.S)
                  suffix = ''
              replacement = (
                  '          test -s "$ZIP"\n'
                  '          if [[ -s "$ZIP.sha256" ]]; then\n'
                  '            sha256sum --check "$ZIP.sha256"\n'
                  '          else\n'
                  f'            EXPECTED_GIT_BLOB_SHA="{SOURCE_SHA}"\n'
                  '            ACTUAL_GIT_BLOB_SHA="$(git hash-object -- "$ZIP")"\n'
                  '            if [[ "$ACTUAL_GIT_BLOB_SHA" != "$EXPECTED_GIT_BLOB_SHA" ]]; then\n'
                  '              echo "::error::El ZIP no coincide con la fuente verificada."\n'
                  '              exit 1\n'
                  '            fi\n'
                  '          fi\n' + suffix
              )
              updated, count = pattern.subn(lambda _: replacement, content, count=1)
              if count != 1:
                  raise SystemExit(f"No se encontró el bloque de validación esperado en {path}")
              target.write_text(updated)

          update('.github/workflows/build-clean-signed.yml', 'build')
          update('.github/workflows/export-source-for-crash-analysis.yml', 'export')
          print('Validación de fuente adaptada a SHA-256 tras la corrección del ZIP.')
          PY

      - name: Corregir las pruebas automatizadas de arranque
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-clean-signed.yml')
          content = path.read_text()
          for api in ('30', '34'):
              pattern = re.compile(
                  r'          script: \|\n(?:(?!      - name:)[^\n]*\n)*?            echo "Inicio verificado en Android API ' + api + r'; PID=\$PID"\n'
              )
              replacement = (
                  '          script: |\n'
                  '            bash "$GITHUB_WORKSPACE/.github/scripts/test-release-startup.sh" '
                  '"$GITHUB_WORKSPACE/AngulismoTV-release-firmado.apk" "com.angulismotv" "startup-api-' + api + '"\n'
              )
              content, count = pattern.subn(lambda _: replacement, content, count=1)
              if count != 1:
                  raise SystemExit(f'No se pudo reemplazar el script de arranque API {api}')
          old_options = '          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect\n'
          new_options = '          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -camera-back none -gpu swiftshader_indirect\n'
          if content.count(old_options) != 2:
              raise SystemExit('No se encontraron ambas configuraciones del emulador')
          content = content.replace(old_options, new_options)
          content = content.replace('          profile: pixel_2\n', '          profile: pixel_2\n          emulator-boot-timeout: 900\n')
          trigger = '      - ".github/scripts/test-release-startup.sh"\n'
          build_trigger = '      - ".github/workflows/build-clean-signed.yml"\n'
          if trigger not in content:
              if build_trigger not in content:
                  raise SystemExit('No se encontró la sección paths del workflow de Release')
              content = content.replace(build_trigger, build_trigger + trigger, 1)
          path.write_text(content)
          print('Pruebas de arranque llaman a un script Bash comprobable y capturan errores del dispositivo.')
          PY

      - name: Confirmar la corrección en la rama de pruebas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "AngulismoTV-ui-estandarizado.zip" \
            "AngulismoTV-ui-estandarizado.zip.sha256" \
            ".github/scripts/test-release-startup.sh" \
            ".github/workflows/build-clean-signed.yml" \
            ".github/workflows/export-source-for-crash-analysis.yml"
          if git diff --cached --quiet; then
            echo "La corrección ya está aplicada; no hace falta otro commit."
          else
            git commit -m "fix: evitar crash de inicio por inicialización temprana de Cast"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Confirmar activación del build de Release
        shell: bash
        run: |
          set -euo pipefail
          echo "El commit con la fuente corregida activa build-clean-signed.yml mediante el cambio de ZIP y checksum."
