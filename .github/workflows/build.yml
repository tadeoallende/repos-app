name: Build desde ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
      - '.github/project-overrides/**'
      - '.github/scripts/apply_zip_overrides.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_IPTV_ORG_URL: ${{ secrets.IPTV_ORG_URL }}
      ORG_GRADLE_PROJECT_CHANNELS_URL: ${{ secrets.CHANNELS_URL }}
      ORG_GRADLE_PROJECT_EVENTS_URL: ${{ secrets.EVENTS_URL }}
      ORG_GRADLE_PROJECT_CUSTOM_CHANNELS_URL: ${{ secrets.CUSTOM_CHANNELS_URL || format('https://raw.githubusercontent.com/{0}/{1}/canales.json', github.repository, github.ref_name) }}
      ORG_GRADLE_PROJECT_UPDATE_URL: ${{ secrets.UPDATE_URL }}
      ORG_GRADLE_PROJECT_WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Aplicar cambios sobre el ZIP base
        run: |
          set -euo pipefail
          ZIP="$(ls *.zip | head -1)"
          echo "Usando: $ZIP"
          python3 .github/scripts/apply_zip_overrides.py "$ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -q -o "$ZIP" -d proyecto
          SETTINGS="$(find proyecto -name settings.gradle.kts | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle.kts dentro del ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK (ya viene en el runner)
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Pruebas unitarias
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Compilar release (prueba R8)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Guardar ZIP actualizado en la rama
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SOURCE_ZIP"
          if git diff --cached --quiet; then
            echo "El ZIP ya estaba actualizado."
            exit 0
          fi
          git commit -m "build: persist updated AngulismoTV ZIP [skip ci]"
          BRANCH="$(git branch --show-current)"
          git push origin "HEAD:$BRANCH"

      - name: Guardar APK para las pruebas
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find "$PROJECT_DIR" -path '*outputs/apk/debug/*.apk' | head -1)"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Build ${{ github.run_number }}" \
            --notes "APK debug generado automáticamente." \
            --prerelease

      - name: Resumen de errores
        if: failure()
        run: |
          {
            echo 'Errores relevantes de compilación:'
            grep -E '^e: |What went wrong|Execution failed|error:' -A4 "$GITHUB_WORKSPACE/build.log" | head -150
          } >> "$GITHUB_STEP_SUMMARY"

  probar-en-emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Escribir script de prueba
        run: |
          cat > prueba.sh <<'SCRIPT'
          #!/bin/bash
          adb install -r apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 20
          adb logcat -d > full.log
          adb exec-out screencap -p > screen.png
          adb shell pidof com.angulismotv > pid.txt || true
          SCRIPT

      - name: Ejecutar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash prueba.sh

      - name: Resumen
        if: always()
        run: |
          {
            echo "Prueba en emulador (Android API ${{ matrix.api }})"
            if [ -s pid.txt ]; then
              echo "La app sigue abierta después de 20 segundos."
            else
              echo "La app NO está en ejecución: se cerró."
            fi
            echo 'Error FATAL EXCEPTION'
            grep -A30 "FATAL EXCEPTION" full.log | head -80 || true
            echo 'Otras líneas de la app'
            grep -E "angulismotv|AndroidRuntime" full.log | head -40 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar capturas y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-api-${{ matrix.api }}
          path: |
            full.log
            screen.png
          if-no-files-found: ignore
probar-en-emulador-tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Preparar prueba Android TV
        run: |
          cat > prueba-tv.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          adb install -r apk/app-debug.apk
          adb shell pm list features > features-tv.txt
          if ! grep -q 'android.software.leanback' features-tv.txt; then
            echo "::error::La imagen iniciada no expone la función Android TV (leanback)."
            exit 1
          fi
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 25
          adb logcat -d > full-tv.log
          adb exec-out screencap -p > screen-tv.png
          adb shell pidof com.angulismotv > pid-tv.txt || true
          if [ ! -s pid-tv.txt ]; then
            echo "::error::AngulismoTV no sigue abierta en el emulador Android TV."
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" full-tv.log; then
            echo "::error::Se detectó una excepción fatal en Android TV."
            grep -A30 "FATAL EXCEPTION" full-tv.log | head -80 || true
            exit 1
          fi
          SCRIPT

      - name: Ejecutar en dispositivo virtual Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash prueba-tv.sh

      - name: Resumen Android TV
        if: always()
        run: |
          {
            echo "Prueba de arranque Android TV (API 34)"
            if [ -s pid-tv.txt ]; then
              echo "La app sigue abierta después de 25 segundos."
            else
              echo "La app NO quedó en ejecución."
            fi
            echo "Características del dispositivo"
            cat features-tv.txt 2>/dev/null | grep -E 'leanback|television|touchscreen' || true
            echo "Excepciones fatales"
            grep -A30 "FATAL EXCEPTION" full-tv.log 2>/dev/null | head -80 || true
            echo "Registros de AngulismoTV"
            grep -E "angulismotv|AndroidRuntime" full-tv.log 2>/dev/null | head -50 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar captura y registros Android TV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-android-tv
          path: |
            screen-tv.png
            full-tv.log
            features-tv.txt
            pid-tv.txt
          if-no-files-found: ignore
