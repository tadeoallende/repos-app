name: Build desde ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
      - '.github/project-overrides/**'
      - '.github/scripts/apply_zip_overrides.py'
      - '.github/scripts/apply_fullscreen_player_modularization.py'
      - '.github/scripts/apply_fullscreen_surface_modularization.py'
      - '.github/scripts/apply_playback_reload_modularization.py'
      - '.github/scripts/apply_playback_lifecycle_modularization.py'
      - '.github/scripts/apply_ui_design_system.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Personal canales.json stays primary; branch-specific fuentes.json controls only the IPTV-org fallback.
      ORG_GRADLE_PROJECT_IPTV_ORG_URL: 'https://iptv-org.github.io/iptv/index.m3u'
      ORG_GRADLE_PROJECT_REMOTE_SOURCES_CONFIG_URL: 'https://raw.githubusercontent.com/tadeoallende/repos-app/refs/heads/${{ github.ref_name }}/fuentes.json'
      ORG_GRADLE_PROJECT_CHANNELS_URL: ''
      ORG_GRADLE_PROJECT_EVENTS_URL: ''
      ORG_GRADLE_PROJECT_CUSTOM_CHANNELS_URL: 'https://raw.githubusercontent.com/tadeoallende/repos-app/refs/heads/main/canales.json'
      ORG_GRADLE_PROJECT_UPDATE_URL: ${{ secrets.UPDATE_URL }}
      ORG_GRADLE_PROJECT_WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar una sola raíz desde la copia más reciente
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort | head -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No se encontró el ZIP fuente."
            exit 1
          fi
          echo "Usando ZIP: $ZIP"
          mkdir -p proyecto/original
          unzip -q -o "$ZIP" -d proyecto/original

          # El archivo cargado contiene una copia antigua y otra más reciente anidada.
          SOURCE_ROOT="proyecto/original/AngulismoTV-limpio (1) (2)"
          if [ ! -f "$SOURCE_ROOT/settings.gradle.kts" ]; then
            SOURCE_ROOT="$(find proyecto/original -mindepth 2 -name settings.gradle.kts -printf '%h\n' | sort | tail -1)"
          fi
          if [ -z "$SOURCE_ROOT" ] || [ ! -f "$SOURCE_ROOT/settings.gradle.kts" ]; then
            echo "::error::No se encontró la raíz Android de la copia más reciente."
            find proyecto/original -name settings.gradle.kts -print
            exit 1
          fi
          echo "Raíz seleccionada: $SOURCE_ROOT"

          # Quitar un cierre residual que no pertenece a XML y rompe AAPT.
          TV_LAYOUT="$SOURCE_ROOT/app/src/main/res/layout/fragment_channels_tv.xml"
          if [ -f "$TV_LAYOUT" ]; then
            sed -i 's#</document_content>##g' "$TV_LAYOUT"
          fi

          # Aplanar la versión elegida. Así los overlays existentes apuntan a los
          # archivos correctos y no se compila accidentalmente la copia anterior.
          (cd "$SOURCE_ROOT" && zip -qr "$GITHUB_WORKSPACE/project-base.zip" . \
            -x './.gradle/*' './.idea/*' './build/*' './app/build/*' './local.properties' './*.zip')

          python3 .github/scripts/apply_zip_overrides.py "$GITHUB_WORKSPACE/project-base.zip"
          python3 .github/scripts/apply_fullscreen_player_modularization.py "$GITHUB_WORKSPACE/project-base.zip"
          python3 .github/scripts/apply_fullscreen_surface_modularization.py "$GITHUB_WORKSPACE/project-base.zip"
          python3 .github/scripts/apply_playback_reload_modularization.py "$GITHUB_WORKSPACE/project-base.zip"
          python3 .github/scripts/apply_playback_lifecycle_modularization.py "$GITHUB_WORKSPACE/project-base.zip"
          mkdir -p proyecto/compilacion
          unzip -q -o "$GITHUB_WORKSPACE/project-base.zip" -d proyecto/compilacion
          PROJECT_DIR="$GITHUB_WORKSPACE/proyecto/compilacion"
          python3 .github/scripts/apply_ui_design_system.py "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK (ya viene en el runner)
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Pruebas unitarias
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Compilar release (prueba R8)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      # El ZIP base se mantiene inmutable en Git. Los overlays se aplican solo
      # dentro del runner para que builds simultáneos no compitan al hacer push
      # del mismo archivo binario a la rama.

      - name: Empaquetar el proyecto normalizado
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/AngulismoTV-ui-estandarizado.zip" . \
            -x './.gradle/*' './.idea/*' './build/*' './app/build/*' './local.properties' './*.zip'

      - name: Guardar APK para las pruebas
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar fuentes estandarizadas
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-ui-estandarizadas
          path: AngulismoTV-ui-estandarizado.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK y fuentes en Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chatgpt/prueba-acceso-2026-10-21-3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s "$GITHUB_WORKSPACE/AngulismoTV-ui-estandarizado.zip"
          gh release create "build-${{ github.run_number }}" "$APK" "$GITHUB_WORKSPACE/AngulismoTV-ui-estandarizado.zip" \
            --target "$GITHUB_SHA" \
            --title "AngulismoTV build ${{ github.run_number }} (UI estandarizada)" \
            --notes "APK debug y fuentes con sistema de diseño visual compartido. Compilado desde el commit $GITHUB_SHA." \
            --prerelease

      - name: Resumen de errores
        if: failure()
        run: |
          {
            echo 'Errores relevantes de compilación:'
            grep -E '^e: |What went wrong|Execution failed|error:' -A4 "$GITHUB_WORKSPACE/build.log" | head -150
          } >> "$GITHUB_STEP_SUMMARY"

  probar-en-emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Escribir script de prueba
        run: |
          cat > prueba.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          adb install -r apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 20
          adb logcat -d > full.log
          adb exec-out screencap -p > screen.png
          adb shell pidof com.angulismotv > pid.txt || true

          if [ ! -s pid.txt ]; then
            echo "::error::AngulismoTV no sigue abierta en Android API ${{ matrix.api }}."
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" full.log; then
            echo "::error::Se detectó una excepción fatal en Android API ${{ matrix.api }}."
            grep -A30 "FATAL EXCEPTION" full.log | head -80 || true
            exit 1
          fi
          SCRIPT

      - name: Ejecutar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash prueba.sh

      - name: Resumen
        if: always()
        run: |
          {
            echo "Prueba en emulador (Android API ${{ matrix.api }})"
            if [ -s pid.txt ]; then
              echo "La app sigue abierta después de 20 segundos."
            else
              echo "La app NO está en ejecución: se cerró."
            fi
            echo 'Error FATAL EXCEPTION'
            grep -A30 "FATAL EXCEPTION" full.log | head -80 || true
            echo 'Otras líneas de la app'
            grep -E "angulismotv|AndroidRuntime" full.log | head -40 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar capturas y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-api-${{ matrix.api }}
          path: |
            full.log
            screen.png
            pid.txt
          if-no-files-found: ignore
  probar-en-emulador-tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Preparar prueba Android TV
        run: |
          cat > prueba-tv.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          adb install -r apk/app-debug.apk
          adb shell pm list features > features-tv.txt
          if ! grep -q 'android.software.leanback' features-tv.txt; then
            echo "::error::La imagen iniciada no expone la función Android TV (leanback)."
            exit 1
          fi
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 25
          adb logcat -d > full-tv.log
          adb exec-out screencap -p > screen-tv.png
          adb shell pidof com.angulismotv > pid-tv.txt || true
          if [ ! -s pid-tv.txt ]; then
            echo "::error::AngulismoTV no sigue abierta en el emulador Android TV."
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" full-tv.log; then
            echo "::error::Se detectó una excepción fatal en Android TV."
            grep -A30 "FATAL EXCEPTION" full-tv.log | head -80 || true
            exit 1
          fi
          SCRIPT

      - name: Ejecutar en dispositivo virtual Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash prueba-tv.sh

      - name: Resumen Android TV
        if: always()
        run: |
          {
            echo "Prueba de arranque Android TV (API 34)"
            if [ -s pid-tv.txt ]; then
              echo "La app sigue abierta después de 25 segundos."
            else
              echo "La app NO quedó en ejecución."
            fi
            echo "Características del dispositivo"
            cat features-tv.txt 2>/dev/null | grep -E 'leanback|television|touchscreen' || true
            echo "Excepciones fatales"
            grep -A30 "FATAL EXCEPTION" full-tv.log 2>/dev/null | head -80 || true
            echo "Registros de AngulismoTV"
            grep -E "angulismotv|AndroidRuntime" full-tv.log 2>/dev/null | head -50 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar captura y registros Android TV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-android-tv
          path: |
            screen-tv.png
            full-tv.log
            features-tv.txt
            pid-tv.txt
          if-no-files-found: ignore
