name: Build desde ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_CHANNELS_URL: ${{ secrets.CHANNELS_URL }}
      ORG_GRADLE_PROJECT_EVENTS_URL: ${{ secrets.EVENTS_URL }}
      ORG_GRADLE_PROJECT_UPDATE_URL: ${{ secrets.UPDATE_URL }}
      ORG_GRADLE_PROJECT_WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      # Firma Android del APK; distinta de UPDATE_PRIVATE_KEY_PEM, que firma el manifiesto.
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          ZIP="$(ls *.zip | head -1)"
          echo "Usando: $ZIP"
          unzip -q -o "$ZIP" -d proyecto
          SETTINGS="$(find proyecto -name settings.gradle.kts | head -1)"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK (ya viene en el runner)
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Corregir inferencia del temporizador de controles
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("app/src/main/java/com/angulismotv/UnifiedPlayerActivity.kt")
          text = source.read_text(encoding="utf-8")
          old = "    private fun resetAutoHideTimer() = controlsVisibility.resetAutoHide()"
          new = "    private fun resetAutoHideTimer(): Unit {\n        controlsVisibility.resetAutoHide()\n    }"

          if old in text:
              text = text.replace(old, new, 1)
              source.write_text(text, encoding="utf-8")
              print("Corrección aplicada: tipo de retorno explícito para resetAutoHideTimer().")
          elif new in text:
              print("La corrección ya está presente.")
          else:
              raise SystemExit("No se encontró la declaración esperada de resetAutoHideTimer; se detiene el build.")
          PY

      - name: Preparar firma Android release
        id: release_signing
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ] ||
             [ -z "${ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD:-}" ] ||
             [ -z "${ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS:-}" ] ||
             [ -z "${ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Faltan secretos de firma Android. Revisá ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS y ANDROID_RELEASE_KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/angulismotv-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" \
            -alias "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" >/dev/null

          echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Keystore y alias verificados; no se imprimen credenciales."

      - name: Compilar debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Compilar release (prueba R8)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Verificar APK release firmado
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::No se generó el APK release."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::No se encontró apksigner."; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK release firmado y verificado con apksigner."


      - name: Actualizar el ZIP con la corrección verificada
        if: success()
        run: |
          test -n "$SOURCE_ZIP"
          rm -f "$SOURCE_ZIP"
          (
            cd "$PROJECT_DIR"
            find . -type d -name build -prune -o -type d -name .gradle -prune -o -type d -name .kotlin -prune -o -type d -name .git -prune -o -type d -name .idea -prune -o -type f -print | sed 's#^./##' | LC_ALL=C sort | zip -q "$GITHUB_WORKSPACE/$SOURCE_ZIP" -@
          )
          ZIP_SIZE="$(stat -c%s "$SOURCE_ZIP")"
          echo "ZIP corregido: $ZIP_SIZE bytes"
          if [ "$ZIP_SIZE" -gt 10000000 ]; then
            echo "El ZIP supera 10 MB; probablemente incluye archivos generados." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE_ZIP"
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve Kotlin auto-hide timer compilation [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Guardar APK para las pruebas
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar APK release firmado
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumen de errores
        if: failure()
        run: |
          {
            echo '## Errores de compilación'
            echo '```'
            grep -E '^e: |What went wrong|Execution failed|error:' -A4 "$GITHUB_WORKSPACE/build.log" | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Abre la app en un emulador de Android y muestra el error si se cierra
  probar-en-emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Escribir script de prueba
        run: |
          cat > prueba.sh <<'SCRIPT'
          #!/bin/bash
          adb install -r apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 20
          adb logcat -d > full.log
          adb exec-out screencap -p > screen.png
          adb shell pidof com.angulismotv > pid.txt || true
          SCRIPT

      - name: Ejecutar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash prueba.sh

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Prueba en emulador (Android API ${{ matrix.api }})"
            if [ -s pid.txt ]; then
              echo "La app sigue abierta después de 20 segundos."
            else
              echo "**La app NO está en ejecución: se cerró.**"
            fi
            echo '### Error (FATAL EXCEPTION)'
            echo '```'
            grep -A30 "FATAL EXCEPTION" full.log | head -80 || true
            echo '```'
            echo '### Otras líneas de la app'
            echo '```'
            grep -E "angulismotv|AndroidRuntime" full.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar capturas y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-api-${{ matrix.api }}
          path: |
            full.log
            screen.png
          if-no-files-found: ignore

  # Probar la variante de distribución firmada, no solamente el APK debug.
  probar-release-firmado:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-release-signed
          path: apk-release

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Preparar prueba del APK release firmado
        run: |
          cat > prueba-release.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          adb install -r apk-release/app-release.apk
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 25
          adb logcat -d > full-release.log
          adb exec-out screencap -p > screen-release.png
          adb shell pidof com.angulismotv > pid-release.txt || true
          if [ ! -s pid-release.txt ]; then
            echo "::error::El APK release firmado no sigue abierto en Android API ${{ matrix.api }}."
            grep -A30 "FATAL EXCEPTION" full-release.log | head -80 || true
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" full-release.log; then
            echo "::error::Se detectó una excepción fatal con el APK release en Android API ${{ matrix.api }}."
            grep -A30 "FATAL EXCEPTION" full-release.log | head -80 || true
            exit 1
          fi
          SCRIPT

      - name: Ejecutar APK release firmado en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash prueba-release.sh

      - name: Resumen de prueba release
        if: always()
        run: |
          {
            echo "## APK release firmado — Android API ${{ matrix.api }}"
            if [ -s pid-release.txt ]; then
              echo "La app siguió abierta después de 25 segundos."
            else
              echo "La app no quedó abierta; revisar el log."
            fi
            echo '### Excepciones'
            echo '```'
            grep -A30 "FATAL EXCEPTION" full-release.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar log y captura de release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-release-api-${{ matrix.api }}
          path: |
            full-release.log
            screen-release.png
            pid-release.txt
          if-no-files-found: ignore

  probar-release-en-android-tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-release-signed
          path: apk-release

      - name: Habilitar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "SIN KVM: el emulador puede tardar mucho"

      - name: Preparar prueba Android TV release
        run: |
          cat > prueba-tv-release.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          adb install -r apk-release/app-release.apk
          adb shell pm list features > features-tv.txt
          grep -q 'android.software.leanback' features-tv.txt || { echo "::error::El emulador no expone Android TV/Leanback."; exit 1; }
          adb logcat -c
          adb shell am start -W -n com.angulismotv/.MainActivity
          sleep 25
          adb logcat -d > full-tv-release.log
          adb exec-out screencap -p > screen-tv-release.png
          adb shell pidof com.angulismotv > pid-tv-release.txt || true
          if [ ! -s pid-tv-release.txt ] || grep -q "FATAL EXCEPTION" full-tv-release.log; then
            echo "::error::El APK release firmado falló en la prueba de apertura Android TV."
            grep -A30 "FATAL EXCEPTION" full-tv-release.log | head -80 || true
            exit 1
          fi
          SCRIPT

      - name: Ejecutar APK release firmado en Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash prueba-tv-release.sh

      - name: Guardar log y captura Android TV release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-release-android-tv
          path: |
            full-tv-release.log
            screen-tv-release.png
            features-tv.txt
            pid-tv-release.txt
          if-no-files-found: ignore

  # La release pública solo se publica cuando pasan la compilación y las pruebas
  # de arranque de debug y release firmado en móviles y Android TV.
  publicar-release:
    needs: [build, probar-en-emulador, probar-release-firmado, probar-release-en-android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk-debug

      - uses: actions/download-artifact@v4
        with:
          name: apk-release-signed
          path: apk-release

      - name: Publicar APK firmado y APK de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s apk-release/app-release.apk
          test -s apk-debug/app-debug.apk
          gh release create "build-${{ github.run_number }}" \
            "apk-release/app-release.apk#app-release.apk" \
            "apk-debug/app-debug.apk#app-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "AngulismoTV build ${{ github.run_number }} (APK firmado verificado)" \
            --notes "app-release.apk está firmado con el keystore Android configurado, verificado con apksigner y probado en emuladores Android 11, Android 14 y Android TV. app-debug.apk es solo para pruebas. El manifiesto de actualización y su firma se mantienen sin cambios hasta aprobar y publicar la URL definitiva del APK." \
            --prerelease
