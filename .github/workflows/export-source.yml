name: Exportar fuentes para refactor de interfaz

on:
  push:
    branches:
      - chatgpt/prueba-acceso-2026-10-21-3
    paths:
      - .github/workflows/export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar-fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer el proyecto subido
        run: |
          set -euo pipefail
          mkdir -p proyecto
          unzip -q -o "AngulismoTV-limpio (1).zip" -d proyecto
          find proyecto -type f | sort -o /tmp/project-files.txt
          head -200 /tmp/project-files.txt

      - name: Empaquetar fuentes para inspección
        uses: actions/upload-artifact@v4
        with:
          name: source-tree-for-ui-refactor
          path: proyecto/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
